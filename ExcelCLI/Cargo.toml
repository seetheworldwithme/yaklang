[package]
name = "excelcli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
calamine = "0.34.0"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
unicode-normalization = "0.1.25"
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"
